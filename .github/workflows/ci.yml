name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (new modular code)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Security audit (non-blocking)
        run: npm audit --omit=dev || true

      - name: Smoke - shared modules load
        run: node -e "require('./shared/progression');require('./shared/weaponConfig');require('./shared/blockConfig');require('./shared/classes');require('./shared/gameModes');require('./shared/quests');console.log('shared modules load OK')"
